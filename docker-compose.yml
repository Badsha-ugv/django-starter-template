services:
  web:
    build: .
    container_name: django_drf
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db

  redis:
    image: redis:latest
    container_name: sandy_redis
    restart: always
    volumes:
      - redis_data:/data

  celery:
    build: .
    container_name: sandy_celery
    restart: always
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - db
    command: celery -A project worker -l info

  db:
    image: postgres:16
    container_name: sandy_db
    restart: always
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

volumes:
  redis_data:
  db_data:
